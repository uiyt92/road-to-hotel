<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">

<title>Road to Hotel · 5 POINTS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050403'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d9a441' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#050403;color:#f3eee4;
     font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.7;
     display:flex;align-items:center;justify-content:center;padding:40px 20px}
.wrap{width:100%;max-width:680px}
.eyebrow{font-size:12px;letter-spacing:.4em;color:#d9a441;margin-bottom:18px}
h1{margin:0;font-family:"East Sea Dokdo",cursive;font-weight:400;
   font-size:clamp(64px,13vw,132px);line-height:1;color:#f3eee4}
.sub{margin:14px 0 0;color:#b9b2a3;font-size:15px}
.rule{height:1px;background:#2e2a20;margin:40px 0 8px}
a.card{display:flex;align-items:baseline;gap:18px;padding:22px 4px;
       border-bottom:1px solid #2e2a20;color:#f3eee4;text-decoration:none;
       transition:padding-left .18s ease,color .18s ease}
a.card:hover{padding-left:12px;color:#f0c96a}
a.card .k{font-size:12px;letter-spacing:.24em;color:#d9a441;flex:none;width:36px}
a.card strong{font-size:22px;font-weight:700;display:block}
a.card span{display:block;font-size:14px;color:#8f887a;margin-top:3px}
a.card .go{margin-left:auto;color:#8f887a;flex:none}
footer{margin-top:36px;font-size:12px;color:#5f594e}
@media(max-width:520px){a.card{gap:12px}a.card .k{width:28px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">MACRO STRATEGY · 5 POINTS</div>
  <h1>Road to Hotel</h1>
  <p class="sub">성공적인 메이드를 위한 거시 전략론<br>CNA NIGHT / PREDIC&amp;NOVA · 第一週 · 120분</p>

  <div class="rule"></div>

  <a class="card" href="./deck.html">
    <span class="k">01</span>
    <span><strong>강의 덱</strong><span>64장 · 전체 화면 F · 노트 N · 목록 O</span></span>
    <span class="go">→</span>
  </a>

  <a class="card" href="./notes.html">
    <span class="k">02</span>
    <span><strong>발표자 노트</strong><span>64장 진행 지시문 · 인쇄 가능</span></span>
    <span class="go">→</span>
  </a>

  <a class="card" href="./script.html">
    <span class="k">03</span>
    <span><strong>강의 대본</strong><span>실제로 말할 내용 · 질문 20개 · 인쇄용</span></span>
    <span class="go">&rarr;</span>
  </a>

  <footer>링크를 아는 사람만 볼 수 있습니다. 검색에는 잡히지 않습니다.</footer>
</main>
