name: Build & Deploy Deck

on:
  push:
    branches: [main]
    paths:
      - 'work/design-canvas/**'
      - 'work/images/web/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 폰트 서브셋 도구 설치
        run: pip install --quiet fonttools brotli

      # 원본 TTF 는 36MB라 레포에 넣지 않는다. Google Fonts 에서 받아 쓴다.
      - name: 원본 폰트 내려받기
        run: |
          set -euo pipefail
          mkdir -p work/design-canvas/fonts && cd work/design-canvas/fonts
          base=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o EastSeaDokdo.ttf "$base/eastseadokdo/EastSeaDokdo-Regular.ttf"
          curl -fsSL -o NotoSansKR.ttf   "$base/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          curl -fsSL -o NotoSerifKR.ttf  "$base/notoserifkr/NotoSerifKR%5Bwght%5D.ttf"
          ls -la *.ttf

      - name: 아트보드 생성
        working-directory: work/design-canvas
        run: node gen-deck.mjs

      - name: 쓰인 글자만 남겨 폰트 굽기
        working-directory: work/design-canvas
        run: node subset-fonts.mjs

      - name: 덱 · 발표자 노트 빌드
        working-directory: work/design-canvas
        run: |
          node build-deck.mjs
          node build-notes.mjs

      - name: 사이트 조립
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/robots.txt _site/robots.txt
          cp outputs/5points_deck.html  _site/deck.html
          cp outputs/5points_notes.html _site/notes.html
          # 검색엔진 색인 차단 — 링크로만 공유한다
          for f in _site/deck.html _site/notes.html; do
            sed -i 's|<meta charset="utf-8">|<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">|' "$f"
          done
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
